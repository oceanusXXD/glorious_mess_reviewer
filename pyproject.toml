[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glorious_mess_reviewer"
version = "0.1.0"
description = "A venue-aware manuscript screening system with FastAPI, CLI, rule grounding, and typed review panels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "ocean", email = "453676955@qq.com" }
]
keywords = [
  "review-automation",
  "workflow-runtime",
  "fastapi",
  "sqlite",
  "structured-output",
  "manuscript-screening"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed"
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "jinja2>=3.1,<4.0",
  "openai>=2.14.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "uvicorn>=0.35,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0"
]

[project.scripts]
glorious_mess_reviewer = "glorious_mess_reviewer.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["glorious_mess_reviewer*"]

[tool.setuptools.package-data]
"glorious_mess_reviewer" = ["py.typed"]
"glorious_mess_reviewer.prompts" = ["templates/*.j2"]
